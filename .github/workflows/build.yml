name: Build Kids Vatika APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Inspect Directory Structure
      run: |
        pwd
        ls -la
        ls -la app || true

    - name: Execute Android Build
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        elif [ -f "./app/gradlew" ]; then
          cd app
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        elif [ -d "./app" ] && [ -f "./app/build.gradle" -o -f "./app/build.gradle.kts" ]; then
          cd app
          gradle assembleDebug --stacktrace
        else
          echo "Looking for gradle build files..."
          BUILD_DIR=$(dirname $(find . -maxdepth 3 -name "build.gradle*" | head -n 1))
          if [ -n "$BUILD_DIR" ]; then
            echo "Found build directory at $BUILD_DIR"
            cd "$BUILD_DIR"
            gradle assembleDebug --stacktrace
          else
            echo "No Gradle file found!"
            exit 1
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KidsVatika-Debug-APK
        path: "**/build/outputs/apk/**/*.apk"
