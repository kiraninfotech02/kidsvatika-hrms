name: Build Kids Vatika APK (Universal Android Support)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Configure Universal Lower Android Version Support
      run: |
        echo "=== Scanning Project Package & MainActivity ==="
        MAIN_ACTIVITY_FILE=$(find . -name "MainActivity.kt" -o -name "MainActivity.java" | head -n 1)

        if [ -n "$MAIN_ACTIVITY_FILE" ]; then
          ACTUAL_PKG=$(grep "^package " "$MAIN_ACTIVITY_FILE" | head -n 1 | sed 's/package //; s/;//; s/\r//')
          echo "Discovered real package: $ACTUAL_PKG"
        else
          ACTUAL_PKG="com.kidsvatika.hrms"
          echo "Defaulting package to: $ACTUAL_PKG"
        fi

        # 1. Structure consolidation
        APP_GRADLE_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | grep -v "^\./build.gradle" | head -n 1)
        APP_DIR=$(dirname "$APP_GRADLE_FILE")

        if [ "$APP_DIR" != "./app" ] && [ -d "$APP_DIR" ]; then
          mkdir -p unified_app
          cp -r "$APP_DIR"/* unified_app/
          rm -rf app
          mv unified_app app
        fi
        mkdir -p app/src/main

        if [ -d "./src" ]; then
          cp -r ./src/* app/src/main/
        fi

        # 2. Patch app/build.gradle.kts for MultiDex & minSdk 24 (Supports Android 7.0+)
        if [ -f "app/build.gradle.kts" ]; then
          # Ensure minSdk is 24 for wide backward compatibility
          sed -i 's/minSdk = [0-9]\+/minSdk = 24/g' app/build.gradle.kts
          # Enable MultiDex inside defaultConfig block if missing
          if ! grep -q "multiDexEnabled" app/build.gradle.kts; then
            sed -i '/defaultConfig {/a \        multiDexEnabled = true' app/build.gradle.kts
          fi
          # Inject Compose Compiler plugin if missing
          if ! grep -q "org.jetbrains.kotlin.plugin.compose" app/build.gradle.kts; then
            sed -i '/plugins {/a \    id("org.jetbrains.kotlin.plugin.compose")' app/build.gradle.kts
          fi
        fi

        # 3. Create Backward-Compatible Manifest
        cat << EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="$ACTUAL_PKG">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.USE_BIOMETRIC" />

            <application
                android:name="androidx.multidex.MultiDexApplication"
                android:allowBackup="false"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Kids Vatika HRMS"
                android:roundIcon="@android:drawable/sym_def_app_icon"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">

                <activity
                    android:name="${ACTUAL_PKG}.MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize"
                    android:configChanges="orientation|screenSize"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

            </application>
        </manifest>
        EOF

        # 4. Enforce MultiDex & AndroidX in gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF
        cp gradle.properties app/

        # 5. Root build and settings files
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KidsVatikaHRMS"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
            id("com.google.devtools.ksp") version "2.0.0-1.0.24" apply false
        }
        EOF

        gradle wrapper --gradle-version 8.7
        chmod +x ./gradlew

    - name: Build Universal Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KidsVatika-Universal-APK
        path: "app/build/outputs/apk/debug/*.apk"
