name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies and Build Vite App
        run: |
          set -e
          echo "=== 1. Building Vite Production Bundle with Relative Paths ==="
          
          # Force Vite to generate relative URLs for Android assets
          export VITE_APP_BASE="./"
          
          if [ -f "package.json" ]; then
            npm install --force || npm install --legacy-peer-deps || true
            
            # Ensure base path is relative in vite build
            npx vite build --base="./" || npm run build || true
          fi

          echo "=== 2. Preparing Android Assets Directory ==="
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kidsvatika/hrms
          mkdir -p app/src/main/res/values

          # Prioritize built production files from dist or build
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "Copying compiled dist files..."
            cp -r dist/* app/src/main/assets/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            echo "Copying compiled build files..."
            cp -r build/* app/src/main/assets/
          else
            echo "Fallback: Copying root web files..."
            cp -r ./* app/src/main/assets/ || true
          fi

          # Fix absolute paths to relative paths inside index.html for Android WebView
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i 's|src="/|src="./|g' app/src/main/assets/index.html
            sed -i 's|href="/|href="./|g' app/src/main/assets/index.html
          fi

          echo "=== 3. Creating Production MainActivity with Web Console & Error Handling ==="
          cat << 'EOF' > app/src/main/java/com/kidsvatika/hrms/MainActivity.java
          package com.kidsvatika.hrms;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.ConsoleMessage;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int PERMISSION_REQ_CODE = 101;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          Log.e("KidsVatikaWebView", "Error loading page: " + error.toString());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                          Log.d("KidsVatikaJS", consoleMessage.message() + " -- From line "
                                  + consoleMessage.lineNumber() + " of "
                                  + consoleMessage.sourceId());
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  requestPermissions();
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void requestPermissions() {
                  String[] permissions = {
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  };
                  ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "=== 4. Setting Themes and Manifest ==="
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.KidsVatikaHRMS">

                  <activity
                      android:name="com.kidsvatika.hrms.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          echo "=== 5. Writing Project Gradle Files ==="
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cp gradle.properties app/

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsVatikaHRMS"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.kidsvatika.hrms"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kidsvatika.hrms"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.core:core:1.13.1")
              implementation("androidx.multidex:multidex:2.0.1")
          }
          EOF

          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Production Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
