name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch Source Code & Unlock Full Vertical Scroll
        run: |
          set -e
          echo "=== 1. Deep Scanning and Patching React Source Code ==="
          python3 -c '
          import os, glob, re

          # Find all TSX, JSX, HTML, and CSS source files
          files = glob.glob("src/**/*.tsx", recursive=True) + \
                  glob.glob("src/**/*.jsx", recursive=True) + \
                  glob.glob("src/**/*.ts", recursive=True) + \
                  glob.glob("src/**/*.js", recursive=True)

          for fpath in files:
              try:
                  with open(fpath, "r", encoding="utf-8") as f:
                      content = f.read()

                  orig = content
                  # Replace overflow-hidden on mockup frames with overflow-y-auto
                  content = re.sub(r"\boverflow-hidden\b", "overflow-y-auto", content)
                  content = re.sub(r"\bh-\[\d+px\]\b", "h-auto min-h-screen", content)
                  content = re.sub(r"\bmax-h-\[\d+px\]\b", "max-h-none", content)
                  content = re.sub(r"\bh-screen\b", "min-h-screen", content)

                  # Strip outer phone frame borders
                  content = re.sub(r"\bborder-\[\d+px\]\b", "border-0", content)
                  content = re.sub(r"\brounded-\[\d+px\]\b", "rounded-none", content)

                  if content != orig:
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"Patched: {fpath}")
              except Exception as e:
                  pass
          '

          echo "=== 2. Building Vite Production Bundle ==="
          if [ -f "package.json" ]; then
            npm install --force || true
            npx vite build --base="./" || npm run build || true
          fi

          echo "=== 3. Setting up Assets Directory ==="
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kidsvatika/hrms
          mkdir -p app/src/main/res/values

          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -r dist/* app/src/main/assets/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* app/src/main/assets/
          else
            cp -r ./* app/src/main/assets/ || true
          fi

          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i 's|src="/|src="./|g' app/src/main/assets/index.html
            sed -i 's|href="/|href="./|g' app/src/main/assets/index.html

            # Inject Universal Touch-Scroll Engine & Element Purger
            python3 -c '
          js_engine = """
          <style>
            * {
              -webkit-overflow-scrolling: touch !important;
            }
            html, body {
              width: 100% !important;
              height: auto !important;
              min-height: 100vh !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
              background-color: #0B1120 !important;
              margin: 0 !important;
              padding: 0 !important;
            }
          </style>
          <script>
            (function() {
              function unlockScreen() {
                // 1. Permanently remove the top testbed card ("Test the real-time check-in...")
                document.querySelectorAll("div, p, span, h1, h2, h3").forEach(function(el) {
                  var txt = el.innerText || "";
                  if (txt.indexOf("Test the real-time check-in") !== -1 || txt.indexOf("Anti-Spoofing") !== -1) {
                    var container = el.closest("div.border, div.rounded-xl, div.rounded-2xl, div[class*=\"p-\"]") || el.parentElement;
                    if (container && container !== document.body) {
                      container.style.display = "none";
                    }
                  }
                });

                // 2. Hide desktop headers, tabs, and export buttons
                document.querySelectorAll("header, nav, [class*=\"header\"], [class*=\"Header\"], [role=\"navigation\"]").forEach(function(el) {
                  el.style.display = "none";
                });

                // 3. Unlock vertical scroll on all containers
                document.querySelectorAll("div, section, main, article").forEach(function(el) {
                  var style = window.getComputedStyle(el);
                  if (style.overflowY === "hidden" || style.overflow === "hidden") {
                    el.style.setProperty("overflow-y", "auto", "important");
                    el.style.setProperty("-webkit-overflow-scrolling", "touch", "important");
                  }
                  var h = parseInt(style.height);
                  if (h > 450 && h < 1100 && el !== document.body && el !== document.documentElement) {
                    el.style.setProperty("height", "auto", "important");
                    el.style.setProperty("min-height", "100vh", "important");
                  }
                  if (style.borderRadius && parseInt(style.borderRadius) > 20) {
                    el.style.setProperty("border-radius", "0px", "important");
                    el.style.setProperty("border", "none", "important");
                    el.style.setProperty("box-shadow", "none", "important");
                  }
                });

                document.documentElement.style.setProperty("overflow-y", "auto", "important");
                document.body.style.setProperty("overflow-y", "auto", "important");
              }

              window.addEventListener("DOMContentLoaded", unlockScreen);
              window.addEventListener("load", unlockScreen);
              setInterval(unlockScreen, 300);
            })();
          </script>
          """

          with open("app/src/main/assets/index.html", "r") as f:
              html = f.read()

          if "unlockScreen" not in html:
              html = html.replace("</head>", js_engine + "</head>")
              with open("app/src/main/assets/index.html", "w") as f:
                  f.write(html)
          '
          fi

          echo "=== 4. Setting Up Android WebView Activity ==="
          python3 -c '
          java_code = """package com.kidsvatika.hrms;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  webView.setVerticalScrollBarEnabled(true);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);
                  webView.setOverScrollMode(View.OVER_SCROLL_ALWAYS);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(false);
                  ws.setLoadWithOverviewMode(false);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  ws.setUserAgentString("Mozilla/5.0 (Linux; Android 9; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissions = {
                          "android.permission.CAMERA",
                          "android.permission.ACCESS_FINE_LOCATION",
                          "android.permission.ACCESS_COARSE_LOCATION"
                      };
                      requestPermissions(permissions, 101);
                  }

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """
          with open("app/src/main/java/com/kidsvatika/hrms/MainActivity.java", "w") as f:
              f.write(java_code)
          '

          echo "=== 5. Setting Themes and Manifest ==="
          python3 -c '
          themes = """<resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0B1120</item>
              </style>
          </resources>"""
          with open("app/src/main/res/values/themes.xml", "w") as f:
              f.write(themes)

          strings = """<resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>"""
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(strings)

          manifest = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <application
                  android:allowBackup=\"false\"
                  android:icon=\"@android:drawable/sym_def_app_icon\"
                  android:label=\"@string/app_name\"
                  android:roundIcon=\"@android:drawable/sym_def_app_icon\"
                  android:supportsRtl=\"true\"
                  android:hardwareAccelerated=\"true\"
                  android:usesCleartextTraffic=\"true\"
                  android:theme=\"@style/Theme.KidsVatikaHRMS\">
                  <activity
                      android:name=\"com.kidsvatika.hrms.MainActivity\"
                      android:exported=\"true\"
                      android:windowSoftInputMode=\"adjustResize\"
                      android:configChanges=\"orientation|screenSize|keyboardHidden\"
                      android:screenOrientation=\"portrait\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)
          '

          echo "=== 6. Gradle Files Setup ==="
          python3 -c '
          gradle_props = """android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"""
          with open("gradle.properties", "w") as f:
              f.write(gradle_props)
          with open("app/gradle.properties", "w") as f:
              f.write(gradle_props)

          settings = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"KidsVatikaHRMS\"
          include(\":app\")"""
          with open("settings.gradle.kts", "w") as f:
              f.write(settings)

          root_gradle = """plugins {
              id(\"com.android.application\") version \"8.5.2\" apply false
          }"""
          with open("build.gradle.kts", "w") as f:
              f.write(root_gradle)

          app_gradle = """plugins {
              id(\"com.android.application\")
          }

          android {
              namespace = \"com.kidsvatika.hrms\"
              compileSdk = 34

              defaultConfig {
                  applicationId = \"com.kidsvatika.hrms\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          with open("app/build.gradle.kts", "w") as f:
              f.write(app_gradle)
          '

          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Production Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
