name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web App & Inject Mobile Fullscreen Mode
        run: |
          set -e
          echo "=== 1. Building Vite Production Bundle ==="
          if [ -f "package.json" ]; then
            npm install --force || true
            npx vite build --base="./" || npm run build || true
          fi

          echo "=== 2. Setting up Assets Directory ==="
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kidsvatika/hrms
          mkdir -p app/src/main/res/values

          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -r dist/* app/src/main/assets/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* app/src/main/assets/
          else
            cp -r ./* app/src/main/assets/ || true
          fi

          # Fix paths to relative
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i 's|src="/|src="./|g' app/src/main/assets/index.html
            sed -i 's|href="/|href="./|g' app/src/main/assets/index.html

            # Inject clean CSS to hide desktop wrapper and expand phone frame to 100%
            python3 -c '
          css = """
          header, nav, .header, [role="navigation"],
          button:has-text("Export"),
          div[class*="QA Testing"],
          div[class*="Code Explorer"],
          div[class*="Sandbox"],
          div[class*="Architecture"] {
              display: none !important;
          }
          html, body {
              width: 100vw !important;
              height: 100vh !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              background-color: #0F172A !important;
          }
          div[class*="device"], div[class*="emulator"], div[class*="phone"], div[class*="screen"],
          div[class*="mockup"], div[class*="pixel"] {
              width: 100vw !important;
              height: 100vh !important;
              max-width: 100vw !important;
              max-height: 100vh !important;
              margin: 0 !important;
              padding: 0 !important;
              border: none !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              position: fixed !important;
              top: 0 !important;
              left: 0 !important;
              right: 0 !important;
              bottom: 0 !important;
              z-index: 999999 !important;
          }
          """
          with open("app/src/main/assets/mobile-override.css", "w") as f:
              f.write(css)

          with open("app/src/main/assets/index.html", "r") as f:
              content = f.read()

          if "mobile-override.css" not in content:
              content = content.replace("</head>", "<link rel=\"stylesheet\" href=\"./mobile-override.css\"></head>")
              with open("app/src/main/assets/index.html", "w") as f:
                  f.write(content)
          '
          fi

          echo "=== 3. Creating Native-Feel WebView Activity ==="
          python3 -c '
          java_code = """package com.kidsvatika.hrms;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int PERMISSION_REQ_CODE = 101;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setSupportZoom(false);
                  webSettings.setBuiltInZoomControls(false);
                  webSettings.setDisplayZoomControls(false);

                  webSettings.setUserAgentString("Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36 KidsVatikaApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(
                              "const tabs = Array.from(document.querySelectorAll(\"button\"));" +
                              "const emuTab = tabs.find(b => b.innerText.includes(\"Emulator\") || b.innerText.includes(\"Device\"));" +
                              "if(emuTab) emuTab.click();", null
                          );
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  requestPermissions();
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void requestPermissions() {
                  String[] permissions = {
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  };
                  ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """
          with open("app/src/main/java/com/kidsvatika/hrms/MainActivity.java", "w") as f:
              f.write(java_code)
          '

          echo "=== 4. Setting Themes and Manifest ==="
          python3 -c '
          themes = """<resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>"""
          with open("app/src/main/res/values/themes.xml", "w") as f:
              f.write(themes)

          strings = """<resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>"""
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(strings)

          manifest = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <application
                  android:allowBackup=\"false\"
                  android:icon=\"@android:drawable/sym_def_app_icon\"
                  android:label=\"@string/app_name\"
                  android:roundIcon=\"@android:drawable/sym_def_app_icon\"
                  android:supportsRtl=\"true\"
                  android:hardwareAccelerated=\"true\"
                  android:usesCleartextTraffic=\"true\"
                  android:theme=\"@style/Theme.KidsVatikaHRMS\">
                  <activity
                      android:name=\"com.kidsvatika.hrms.MainActivity\"
                      android:exported=\"true\"
                      android:windowSoftInputMode=\"adjustResize\"
                      android:configChanges=\"orientation|screenSize|keyboardHidden\"
                      android:screenOrientation=\"portrait\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)
          '

          echo "=== 5. Writing Project Gradle Files ==="
          python3 -c '
          gradle_props = """android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"""
          with open("gradle.properties", "w") as f:
              f.write(gradle_props)
          with open("app/gradle.properties", "w") as f:
              f.write(gradle_props)

          settings = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"KidsVatikaHRMS\"
          include(\":app\")"""
          with open("settings.gradle.kts", "w") as f:
              f.write(settings)

          root_gradle = """plugins {
              id(\"com.android.application\") version \"8.5.2\" apply false
          }"""
          with open("build.gradle.kts", "w") as f:
              f.write(root_gradle)

          app_gradle = """plugins {
              id(\"com.android.application\")
          }

          android {
              namespace = \"com.kidsvatika.hrms\"
              compileSdk = 34

              defaultConfig {
                  applicationId = \"com.kidsvatika.hrms\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
                  multiDexEnabled = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation(\"androidx.core:core:1.13.1\")
              implementation(\"androidx.multidex:multidex:2.0.1\")
          }"""
          with open("app/build.gradle.kts", "w") as f:
              f.write(app_gradle)
          '

          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Production Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
