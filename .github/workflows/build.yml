name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate True Native Project or Re-engineer Mobile Frame
        run: |
          set -e
          echo "=== 1. Searching for Native Kotlin Source Base ==="
          
          # Check if there is an exported zip containing native Kotlin app
          ZIP_FILE=$(find . -name "*.zip" | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -q -o "$ZIP_FILE" -d extracted_app || true
          fi

          echo "=== 2. Rebuilding Web Assets with Strict Fullscreen Overwrite ==="
          if [ -f "package.json" ]; then
            npm install --force || true
            npx vite build --base="./" || npm run build || true
          fi

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kidsvatika/hrms
          mkdir -p app/src/main/res/values

          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -r dist/* app/src/main/assets/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* app/src/main/assets/
          else
            cp -r ./* app/src/main/assets/ || true
          fi

          # Fix Asset URLs
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i 's|src="/|src="./|g' app/src/main/assets/index.html
            sed -i 's|href="/|href="./|g' app/src/main/assets/index.html
          fi

          # 3. Create a Custom Fullscreen HTML Wrapper that embeds ONLY the phone content and unlocks touch scroll
          python3 -c '
          import os

          # Read original index
          with open("app/src/main/assets/index.html", "r", encoding="utf-8") as f:
              orig_html = f.read()

          # Inject CSS directly into the HTML head so it CANNOT be overridden by React
          critical_css = """
          <style id="android-fullscreen-lock">
            /* Nuclear removal of top elements */
            header, nav, [class*="Header"], [class*="Navbar"], [class*="tabs"], [class*="Tabs"],
            div[class*="QA Testing"], div[class*="Code Explorer"], div[class*="Sandbox"], div[class*="Architecture"],
            button:has(svg), a[download] {
              display: none !important;
              height: 0px !important;
              visibility: hidden !important;
            }

            html, body {
              width: 100vw !important;
              min-height: 100vh !important;
              height: auto !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow-x: hidden !important;
              overflow-y: scroll !important;
              -webkit-overflow-scrolling: touch !important;
              background-color: #0F172A !important;
            }

            /* Strip the phone mockup container completely so it expands full display */
            div[class*="rounded-[40px]"], div[class*="rounded-[48px]"],
            div[class*="border-[8px]"], div[class*="border-[12px]"],
            div[class*="border-slate-800"], div[class*="max-w-sm"],
            div[style*="border-radius: 40px"], div[style*="border-radius: 48px"] {
              border: none !important;
              border-radius: 0px !important;
              box-shadow: none !important;
              width: 100vw !important;
              max-width: 100vw !important;
              min-height: 100vh !important;
              height: auto !important;
              padding: 0px !important;
              margin: 0px !important;
              overflow-y: visible !important;
              background-color: #0F172A !important;
            }

            /* Unblock scrolling on any internal scrolling container */
            div[class*="overflow-hidden"], div[class*="overflow-y-auto"], main, section {
              overflow-y: visible !important;
              height: auto !important;
              min-height: 100vh !important;
            }
          </style>
          <script id="android-touch-unlocker">
            // Force touch event handling & remove testbed badge
            function purgeBadges() {
              var all = document.querySelectorAll("div, p, span");
              for (var i = 0; i < all.length; i++) {
                var el = all[i];
                if (el.innerText && (el.innerText.indexOf("Test the real-time check-in") !== -1 || el.innerText.indexOf("Google Pixel 8 Android Testbed") !== -1)) {
                  var p = el.parentElement;
                  while (p && p !== document.body && !p.classList.contains("border") && !p.classList.contains("rounded-2xl")) {
                    p = p.parentElement;
                  }
                  if (p && p !== document.body) {
                    p.style.display = "none";
                  }
                }
              }
            }
            window.addEventListener("DOMContentLoaded", purgeBadges);
            setInterval(purgeBadges, 200);
          </script>
          """

          if "android-fullscreen-lock" not in orig_html:
              orig_html = orig_html.replace("</head>", critical_css + "</head>")
              with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
                  f.write(orig_html)
          '

          echo "=== 4. Native MainActivity with Direct Touch Delegation ==="
          python3 -c '
          java_code = """package com.kidsvatika.hrms;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setOverScrollMode(View.OVER_SCROLL_ALWAYS);

                  // Fix touch drag on older Android 9 devices
                  webView.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                              case MotionEvent.ACTION_UP:
                                  if (!v.hasFocus()) {
                                      v.requestFocus();
                                  }
                                  break;
                          }
                          return false;
                      }
                  });

                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  ws.setUserAgentString("Mozilla/5.0 (Linux; Android 9; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissions = {
                          "android.permission.CAMERA",
                          "android.permission.ACCESS_FINE_LOCATION",
                          "android.permission.ACCESS_COARSE_LOCATION"
                      };
                      requestPermissions(permissions, 101);
                  }

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """
          with open("app/src/main/java/com/kidsvatika/hrms/MainActivity.java", "w") as f:
              f.write(java_code)
          '

          echo "=== 5. Hardened Manifest & Styles ==="
          python3 -c '
          themes = """<resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>"""
          with open("app/src/main/res/values/themes.xml", "w") as f:
              f.write(themes)

          strings = """<resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>"""
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(strings)

          manifest = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <application
                  android:allowBackup=\"false\"
                  android:icon=\"@android:drawable/sym_def_app_icon\"
                  android:label=\"@string/app_name\"
                  android:roundIcon=\"@android:drawable/sym_def_app_icon\"
                  android:supportsRtl=\"true\"
                  android:hardwareAccelerated=\"true\"
                  android:usesCleartextTraffic=\"true\"
                  android:theme=\"@style/Theme.KidsVatikaHRMS\">
                  <activity
                      android:name=\"com.kidsvatika.hrms.MainActivity\"
                      android:exported=\"true\"
                      android:windowSoftInputMode=\"adjustResize\"
                      android:configChanges=\"orientation|screenSize|keyboardHidden\"
                      android:screenOrientation=\"portrait\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)
          '

          echo "=== 6. Gradle Project Scripts ==="
          python3 -c '
          gradle_props = """android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"""
          with open("gradle.properties", "w") as f:
              f.write(gradle_props)
          with open("app/gradle.properties", "w") as f:
              f.write(gradle_props)

          settings = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"KidsVatikaHRMS\"
          include(\":app\")"""
          with open("settings.gradle.kts", "w") as f:
              f.write(settings)

          root_gradle = """plugins {
              id(\"com.android.application\") version \"8.5.2\" apply false
          }"""
          with open("build.gradle.kts", "w") as f:
              f.write(root_gradle)

          app_gradle = """plugins {
              id(\"com.android.application\")
          }

          android {
              namespace = \"com.kidsvatika.hrms\"
              compileSdk = 34

              defaultConfig {
                  applicationId = \"com.kidsvatika.hrms\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          with open("app/build.gradle.kts", "w") as f:
              f.write(app_gradle)
          '

          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Pure Production APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
