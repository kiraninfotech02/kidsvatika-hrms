name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web App & Inject Mobile Fullscreen Mode
        run: |
          set -e
          echo "=== 1. Building Vite Production Bundle ==="
          if [ -f "package.json" ]; then
            npm install --force || npm install --legacy-peer-deps || true
            npx vite build --base="./" || npm run build || true
          fi

          echo "=== 2. Setting up Assets Directory ==="
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kidsvatika/hrms
          mkdir -p app/src/main/res/values

          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -r dist/* app/src/main/assets/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* app/src/main/assets/
          else
            cp -r ./* app/src/main/assets/ || true
          fi

          # 3. Path sanitization for Android Asset loading
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i 's|src="/|src="./|g' app/src/main/assets/index.html
            sed -i 's|href="/|href="./|g' app/src/main/assets/index.html

            # Inject CSS to hide laptop dashboard and force emulator to become full-screen native mobile view
            cat << 'EOF' > app/src/main/assets/mobile-override.css
            /* Hide top developer header, tabs, and sidebar tools */
            header, nav, .header, [role="navigation"], 
            button:has-text("Export"), 
            div:has(> button:contains("Export")),
            div[class*="QA Testing"],
            div[class*="Code Explorer"],
            div[class*="Sandbox"],
            div[class*="Architecture"] {
                display: none !important;
            }

            /* Make body fit perfectly to mobile viewport */
            html, body {
                width: 100vw !important;
                height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                background-color: #0F172A !important;
                -webkit-user-select: none;
                user-select: none;
            }

            /* Target the phone emulator frame and make it 100% full screen */
            div[class*="device"], div[class*="emulator"], div[class*="phone"], div[class*="screen"],
            div[class*="mockup"], div[class*="pixel"] {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                z-index: 999999 !important;
            }
            EOF

            sed -i 's|</head>|<link rel="stylesheet" href="./mobile-override.css"></head>|' app/src/main/assets/index.html
          fi

          echo "=== 4. Creating Native-Feel WebView Activity ==="
          cat << 'EOF' > app/src/main/java/com/kidsvatika/hrms/MainActivity.java
          package com.kidsvatika.hrms;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int PERMISSION_REQ_CODE = 101;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Enable full screen mobile look
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setSupportZoom(false);
                  webSettings.setBuiltInZoomControls(false);
                  webSettings.setDisplayZoomControls(false);

                  // Force mobile user agent so app renders pure mobile UI
                  webSettings.setUserAgentString("Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36 KidsVatikaApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          // Extra JS injection to click emulator tab or hide wrapper panels
                          view.evaluateJavascript(
                              "const tabs = Array.from(document.querySelectorAll('button'));" +
                              "const emuTab = tabs.find(b => b.innerText.includes('Emulator') || b.innerText.includes('Device'));" +
                              "if(emuTab) emuTab.click();", null
                          );
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  requestPermissions();
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void requestPermissions() {
                  String[] permissions = {
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  };
                  ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "=== 5. Setting Themes and Manifest ==="
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.KidsVatikaHRMS">

                  <activity
                      android:name="com.kidsvatika.hrms.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          echo "=== 6. Project Gradle Configuration ==="
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cp gradle.properties app/

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsVatikaHRMS"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.kidsvatika.hrms"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kidsvatika.hrms"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  multiDexEnabled = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.core:core:1.13.1")
              implementation("androidx.multidex:multidex:2.0.1")
          }
          EOF

          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Production Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
