name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Core Mobile App & Build Clean Assets
        run: |
          set -e
          echo "=== 1. Patching App Component to Remove Shell ==="
          python3 -c '
          import os, glob, re

          # Find all source files
          files = glob.glob("src/**/*.{tsx,jsx,ts,js}", recursive=True)
          
          # 1. Identify files containing the testbed text or tabs and clean them
          for fpath in files:
              try:
                  with open(fpath, "r", encoding="utf-8") as f:
                      txt = f.read()

                  orig = txt
                  # Remove outer phone mockup borders and fixed heights
                  txt = re.sub(r"rounded-\[(?:40|48)px\]", "rounded-none", txt)
                  txt = re.sub(r"border-\[(?:8|10|12)px\]", "border-0", txt)
                  txt = re.sub(r"h-\[(?:700|750|800|844)px\]", "h-auto min-h-screen", txt)
                  txt = re.sub(r"max-w-(?:sm|md|xs)", "max-w-none w-full", txt)
                  txt = re.sub(r"overflow-hidden", "overflow-y-auto", txt)

                  if txt != orig:
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(txt)
                      print(f"Sanitized mockup styles in: {fpath}")
              except Exception as e:
                  pass
          '

          echo "=== 2. Building Clean Production Web Bundle ==="
          if [ -f "package.json" ]; then
            npm install --force || true
            npx vite build --base="./" || npm run build || true
          fi

          echo "=== 3. Setting Up Android Assets ==="
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kidsvatika/hrms
          mkdir -p app/src/main/res/values

          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -r dist/* app/src/main/assets/
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* app/src/main/assets/
          else
            cp -r ./* app/src/main/assets/ || true
          fi

          # 4. Inject direct full-screen CSS & scroll enforcer
          if [ -f "app/src/main/assets/index.html" ]; then
            sed -i 's|src="/|src="./|g' app/src/main/assets/index.html
            sed -i 's|href="/|href="./|g' app/src/main/assets/index.html

            python3 -c '
          css = """
          /* Complete elimination of top web UI */
          header, nav, [class*="Header"], [class*="Navbar"], [class*="tabs"], [class*="Tabs"],
          div[class*="QA Testing"], div[class*="Code Explorer"], div[class*="Sandbox"], div[class*="Architecture"],
          button:has(svg), a[download] {
              display: none !important;
          }

          /* Force complete touch scroll on body */
          html, body {
              width: 100% !important;
              min-height: 100vh !important;
              height: auto !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
              -webkit-overflow-scrolling: touch !important;
              background-color: #0B1120 !important;
          }

          /* Fullscreen native look for inner phone app */
          div[class*="device"], div[class*="emulator"], div[class*="phone"], div[class*="pixel"],
          div[class*="mockup"], main, section {
              width: 100% !important;
              max-width: 100% !important;
              height: auto !important;
              min-height: 100vh !important;
              border: none !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              position: static !important;
              overflow-y: visible !important;
              background: #0B1120 !important;
          }
          """
          with open("app/src/main/assets/pure-mobile.css", "w") as f:
              f.write(css)

          js_engine = """
          <link rel="stylesheet" href="./pure-mobile.css">
          <script>
            (function() {
              function cleanupDOM() {
                // Permanently remove the top testbed card
                document.querySelectorAll("div, p, span, h1, h2, h3").forEach(function(el) {
                  var txt = el.innerText || "";
                  if (txt.includes("Google Pixel 8 Android Testbed") || txt.includes("Test the real-time check-in") || txt.includes("Anti-Spoofing")) {
                    var card = el.closest(".border, .rounded-xl, .rounded-2xl, div[class*=\"p-\"]");
                    if (card && card !== document.body) {
                      card.remove();
                    }
                  }
                  if (txt.includes("Kids Vatika Smart") && (el.tagName === "HEADER" || el.closest("header"))) {
                    var hdr = el.closest("header");
                    if (hdr) hdr.remove();
                  }
                });

                // Unlock all scrollable layers
                document.querySelectorAll("*").forEach(function(el) {
                  var style = window.getComputedStyle(el);
                  if (style.overflowY === "hidden" || style.overflow === "hidden") {
                    el.style.setProperty("overflow-y", "auto", "important");
                    el.style.setProperty("-webkit-overflow-scrolling", "touch", "important");
                  }
                });
              }

              window.addEventListener("DOMContentLoaded", cleanupDOM);
              window.addEventListener("load", cleanupDOM);
              setInterval(cleanupDOM, 250);
            })();
          </script>
          """

          with open("app/src/main/assets/index.html", "r") as f:
              html = f.read()

          if "pure-mobile.css" not in html:
              html = html.replace("</head>", js_engine + "</head>")
              with open("app/src/main/assets/index.html", "w") as f:
                  f.write(html)
          '
          fi

          echo "=== 5. Writing Pure Zero-Dependency MainActivity ==="
          python3 -c '
          java_code = """package com.kidsvatika.hrms;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setOverScrollMode(View.OVER_SCROLL_ALWAYS);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  ws.setUserAgentString("Mozilla/5.0 (Linux; Android 9; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissions = {
                          "android.permission.CAMERA",
                          "android.permission.ACCESS_FINE_LOCATION",
                          "android.permission.ACCESS_COARSE_LOCATION"
                      };
                      requestPermissions(permissions, 101);
                  }

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """
          with open("app/src/main/java/com/kidsvatika/hrms/MainActivity.java", "w") as f:
              f.write(java_code)
          '

          echo "=== 6. Setting Themes and Manifest ==="
          python3 -c '
          themes = """<resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0B1120</item>
              </style>
          </resources>"""
          with open("app/src/main/res/values/themes.xml", "w") as f:
              f.write(themes)

          strings = """<resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>"""
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(strings)

          manifest = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <application
                  android:allowBackup=\"false\"
                  android:icon=\"@android:drawable/sym_def_app_icon\"
                  android:label=\"@string/app_name\"
                  android:roundIcon=\"@android:drawable/sym_def_app_icon\"
                  android:supportsRtl=\"true\"
                  android:hardwareAccelerated=\"true\"
                  android:usesCleartextTraffic=\"true\"
                  android:theme=\"@style/Theme.KidsVatikaHRMS\">
                  <activity
                      android:name=\"com.kidsvatika.hrms.MainActivity\"
                      android:exported=\"true\"
                      android:windowSoftInputMode=\"adjustResize\"
                      android:configChanges=\"orientation|screenSize|keyboardHidden\"
                      android:screenOrientation=\"portrait\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)
          '

          echo "=== 7. Writing Project Gradle Files ==="
          python3 -c '
          gradle_props = """android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"""
          with open("gradle.properties", "w") as f:
              f.write(gradle_props)
          with open("app/gradle.properties", "w") as f:
              f.write(gradle_props)

          settings = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"KidsVatikaHRMS\"
          include(\":app\")"""
          with open("settings.gradle.kts", "w") as f:
              f.write(settings)

          root_gradle = """plugins {
              id(\"com.android.application\") version \"8.5.2\" apply false
          }"""
          with open("build.gradle.kts", "w") as f:
              f.write(root_gradle)

          app_gradle = """plugins {
              id(\"com.android.application\")
          }

          android {
              namespace = \"com.kidsvatika.hrms\"
              compileSdk = 34

              defaultConfig {
                  applicationId = \"com.kidsvatika.hrms\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          with open("app/build.gradle.kts", "w") as f:
              f.write(app_gradle)
          '

          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Final Production APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
