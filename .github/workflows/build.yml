name: Build Kids Vatika Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Setup Script
        run: |
          cat << 'EOF' > setup_app.py
          import os

          os.makedirs("app/src/main/java/com/kidsvatika/hrms", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          # 1. MainActivity.java
          java_code = """package com.kidsvatika.hrms;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_URL = "https://kids-vatika-hrms-android-app-kotlin-studio-342025676799.asia-southeast1.run.app";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  webView.setVerticalScrollBarEnabled(true);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);
                  webView.setOverScrollMode(View.OVER_SCROLL_IF_CONTENT_SCROLLS);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  ws.setUserAgentString("Mozilla/5.0 (Linux; Android 9; Pixel 8 Build/PPR1.180610.011) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36 KidsVatikaApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          String script = "(function() { " +
                                  "var css = 'header, nav, [class*=\"header\"], [class*=\"Header\"], div[class*=\"QA Testing\"], div[class*=\"Code Explorer\"], div[class*=\"Sandbox\"], div[class*=\"Architecture\"], a[download] { display: none !important; } ' +" +
                                  "'html, body { width: 100% !important; min-height: 100% !important; height: auto !important; overflow-y: auto !important; -webkit-overflow-scrolling: touch !important; background-color: #0B1120 !important; } ' +" +
                                  "'div[class*=\"rounded-[\"], div[class*=\"border-[\"], div[style*=\"border-radius\"] { border: none !important; border-radius: 0px !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important; height: auto !important; min-height: 100vh !important; } ' +" +
                                  "'div[class*=\"overflow-hidden\"] { overflow-y: visible !important; height: auto !important; }';" +
                                  "var s = document.createElement(\"style\");" +
                                  "s.innerHTML = css;" +
                                  "document.head.appendChild(s);" +
                                  "document.querySelectorAll(\"div, p, span\").forEach(function(el) {" +
                                  "  if (el.innerText && (el.innerText.indexOf(\"Test the real-time check-in\") !== -1 || el.innerText.indexOf(\"Google Pixel 8 Android Testbed\") !== -1)) {" +
                                  "    var p = el.closest(\".border, .rounded-xl, .rounded-2xl, div[class*=\\\"p-\\\"]\");" +
                                  "    if (p) p.style.display = \"none\";" +
                                  "  }" +
                                  "});" +
                                  "})();";
                          view.evaluateJavascript(script, null);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissions = {
                          Manifest.permission.CAMERA,
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      };
                      requestPermissions(permissions, 101);
                  }

                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """
          with open("app/src/main/java/com/kidsvatika/hrms/MainActivity.java", "w") as f:
              f.write(java_code)

          # 2. Themes and Strings
          themes = """<resources>
              <style name="Theme.KidsVatikaHRMS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:statusBarColor">#0B1120</item>
              </style>
          </resources>"""
          with open("app/src/main/res/values/themes.xml", "w") as f:
              f.write(themes)

          strings = """<resources>
              <string name="app_name">Kids Vatika HRMS</string>
          </resources>"""
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(strings)

          # 3. AndroidManifest.xml
          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.KidsVatikaHRMS">
                  <activity
                      android:name="com.kidsvatika.hrms.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)

          # 4. Gradle Files
          gradle_props = """android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"""
          with open("gradle.properties", "w") as f:
              f.write(gradle_props)
          with open("app/gradle.properties", "w") as f:
              f.write(gradle_props)

          settings = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsVatikaHRMS"
          include(":app")"""
          with open("settings.gradle.kts", "w") as f:
              f.write(settings)

          root_gradle = """plugins {
              id("com.android.application") version "8.5.2" apply false
          }"""
          with open("build.gradle.kts", "w") as f:
              f.write(root_gradle)

          app_gradle = """plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.kidsvatika.hrms"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kidsvatika.hrms"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          with open("app/build.gradle.kts", "w") as f:
              f.write(app_gradle)

          print("All project configurations generated successfully.")
          EOF
          python3 setup_app.py
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Bullet-Proof APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsVatika-Production-APK
          path: "app/build/outputs/apk/debug/*.apk"
