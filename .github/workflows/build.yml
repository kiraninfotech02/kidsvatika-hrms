name: Build Kids Vatika APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Fix Project Root Structure
      run: |
        TARGET_DIR=$(dirname $(find . -name "build.gradle.kts" | head -n 1))
        echo "Found app module at: $TARGET_DIR"

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KidsVatikaHRMS"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("com.google.devtools.ksp") version "2.0.0-1.0.24" apply false
        }
        EOF

        if [ "$TARGET_DIR" != "./app" ]; then
          echo "Restructuring from $TARGET_DIR to ./app"
          mkdir -p temp_app
          cp -r $TARGET_DIR/* temp_app/
          rm -rf app
          mv temp_app app
        fi

        gradle wrapper --gradle-version 8.7

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KidsVatika-Debug-APK
        path: "app/build/outputs/apk/debug/*.apk"
