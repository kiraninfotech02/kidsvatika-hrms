      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || (typeof Window !== 'undefined' && obj === Window.prototype)) && prop === 'fetch' && descriptor) {
              var customDesc = Object.assign({}, descriptor);
              customDesc.configurable = true;
              customDesc.enumerable = true;
              if (customDesc.get && !customDesc.set) {
                var currentVal = undefined;
                var origGet = customDesc.get;
                customDesc.set = function(val) {
                  currentVal = val;
                };
                customDesc.get = function() {
                  return currentVal !== undefined ? currentVal : origGet();
                };
              }
              return origDefineProperty.call(Object, obj, prop, customDesc);
            }
            return origDefineProperty.apply(Object, arguments);
          };
        } catch (e) {}
      })();
    </script>
